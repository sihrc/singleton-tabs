<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Singleton Tabs</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">1</span>
        <div>
          <h1>Singleton Tabs</h1>
          <p class="muted">One intentional home for each app.</p>
        </div>
      </header>

      <section class="card current" aria-labelledby="current-heading">
        <p class="eyebrow" id="current-heading">Current tab</p>
        <strong id="rule-name">Checking…</strong>
        <p id="rule-detail" class="muted">Reading the active tab.</p>
        <span id="tab-badge" class="badge" hidden></span>
      </section>

      <button id="duplicate" class="primary full" type="button" disabled>
        Duplicate this tab
      </button>

      <div class="actions secondary-actions">
        <button id="reconcile" type="button">Reconcile now</button>
        <button id="options" type="button">Manage rules</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
